<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>略略略大王 - AI聊天</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f0f1a;
    --user-bg: #0f0f1a;
    --card: #1a1a2e;
    --card-light: #222244;
    --text: #e8e8f0;
    --text-dim: #8888aa;
    --accent: #ff6b9d;
    --accent2: #c084fc;
    --accent3: #60a5fa;
    --green: #4ade80;
    --gold: #fbbf24;
    --red: #f87171;
    --gradient: linear-gradient(135deg, #ff6b9d, #c084fc, #60a5fa);
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--user-bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }

  .bg-animation {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
    opacity: 0.4;
  }
  .bg-animation span {
    position: absolute;
    display: block;
    width: 20px;
    height: 20px;
    background: rgba(255,255,255,0.03);
    border-radius: 50%;
    animation: float 15s infinite;
    bottom: -20px;
  }
  .bg-animation span:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-delay: 0s; animation-duration: 18s; }
  .bg-animation span:nth-child(2) { left: 20%; width: 40px; height: 40px; animation-delay: 2s; animation-duration: 15s; }
  .bg-animation span:nth-child(3) { left: 30%; width: 60px; height: 60px; animation-delay: 4s; animation-duration: 20s; }
  .bg-animation span:nth-child(4) { left: 50%; width: 30px; height: 30px; animation-delay: 1s; animation-duration: 12s; }
  .bg-animation span:nth-child(5) { left: 65%; width: 50px; height: 50px; animation-delay: 3s; animation-duration: 17s; }
  .bg-animation span:nth-child(6) { left: 75%; width: 70px; height: 70px; animation-delay: 5s; animation-duration: 14s; }
  .bg-animation span:nth-child(7) { left: 85%; width: 35px; height: 35px; animation-delay: 6s; animation-duration: 16s; }
  .bg-animation span:nth-child(8) { left: 90%; width: 45px; height: 45px; animation-delay: 2.5s; animation-duration: 19s; }

  @keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.3; }
    90% { opacity: 0.1; }
    100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
  }

  /* ===== Header ===== */
  .header {
    position: relative;
    z-index: 10;
    background: rgba(15,15,26,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--gradient);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
    position: relative;
    box-shadow: 0 0 20px rgba(192,132,252,0.3);
  }
  .avatar .online-dot {
    position: absolute; bottom: 1px; right: 1px;
    width: 12px; height: 12px; background: var(--green);
    border-radius: 50%; border: 2px solid var(--bg);
  }
  .header-info { flex: 1; min-width: 0; }
  .header-info h1 {
    font-size: 17px; font-weight: 700;
    color: #60a5fa;
  }
  .header-info .status {
    font-size: 12px; color: var(--text-dim);
    display: flex; align-items: center; gap: 4px;
  }
  .header-info .status .dot {
    width: 6px; height: 6px; background: var(--green);
    border-radius: 50%; display: inline-block;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .header-actions { display: flex; gap: 6px; }
  .header-btn {
    background: rgba(255,255,255,0.06);
    border: none; color: var(--text-dim); width: 36px; height: 36px;
    border-radius: 50%; font-size: 16px; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  }
  .header-btn:hover { background: rgba(255,255,255,0.12); color: var(--text); }

  /* ===== Chat Messages ===== */
  .chat-area {
    position: relative; z-index: 5;
    height: calc(100vh - 180px);
    overflow-y: auto; padding: 16px;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  @media (min-width: 768px) {
    .chat-area { padding: 20px 24px; }
    .header { padding: 16px 28px; }
    .input-area { padding: 12px 24px 20px; }
    .container { max-width: 800px; margin: 0 auto; }
  }

  .msg {
    display: flex; gap: 10px; margin-bottom: 16px;
    animation: msgIn 0.35s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.bot { align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }

  .msg .av {
    width: 34px; height: 34px; border-radius: 50%;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .msg.bot .av { background: var(--gradient); }
  .msg.user .av {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
  }

  .msg .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
    word-break: break-word;
    position: relative;
  }
  .msg.bot .bubble {
    background: var(--card-light);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #ff6b9d, #c084fc);
    border-bottom-right-radius: 4px;
    color: #fff;
  }

  .msg .bubble .time {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    display: block;
  }
  .msg.user .bubble .time { color: rgba(255,255,255,0.6); }

  .msg .bubble .typing-indicator {
    display: flex; gap: 4px; padding: 4px 0;
  }
  .msg .bubble .typing-indicator span {
    width: 8px; height: 8px; background: var(--text-dim);
    border-radius: 50%; animation: typing 1.4s infinite;
  }
  .msg .bubble .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .msg .bubble .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }

  /* ===== Suggestions ===== */
  .suggestions {
    display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 8px;
    position: relative; z-index: 5;
  }
  .suggestions button {
    padding: 6px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .suggestions button:hover {
    background: rgba(192,132,252,0.15);
    border-color: rgba(192,132,252,0.3);
    color: var(--text);
  }

  /* ===== Input Area ===== */
  .input-area {
    position: relative; z-index: 10;
    padding: 10px 16px 16px;
    background: rgba(15,15,26,0.9);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .input-wrap {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--card-light);
    border-radius: 20px;
    padding: 4px 4px 4px 16px;
    border: 1px solid rgba(255,255,255,0.08);
    transition: border-color 0.2s;
  }
  .input-wrap:focus-within {
    border-color: rgba(192,132,252,0.4);
    box-shadow: 0 0 20px rgba(192,132,252,0.08);
  }
  .input-wrap textarea {
    flex: 1; background: none; border: none;
    color: var(--text); font-size: 14px;
    font-family: inherit; padding: 10px 0;
    outline: none; resize: none;
    max-height: 100px; line-height: 1.5;
    min-height: 24px;
  }
  .input-wrap textarea::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--gradient); border: none;
    color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(192,132,252,0.4); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ===== Welcome ===== */
  .welcome-msg {
    text-align: center; padding: 40px 20px 20px;
    animation: msgIn 0.6s ease;
  }
  .welcome-msg .big-avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--gradient); margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; box-shadow: 0 0 30px rgba(192,132,252,0.3);
  }
  .welcome-msg h2 {
    font-size: 22px; font-weight: 700;
    background: var(--gradient); -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 8px;
  }
  .welcome-msg p {
    color: var(--text-dim); font-size: 14px; line-height: 1.8;
    max-width: 300px; margin: 0 auto;
  }
  .welcome-msg .tags {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    margin-top: 12px;
  }
  .welcome-msg .tags span {
    padding: 4px 10px; background: rgba(255,255,255,0.06);
    border-radius: 12px; font-size: 11px; color: var(--text-dim);
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    background: var(--card-light); color: var(--text);
    padding: 10px 20px; border-radius: 12px; font-size: 13px;
    z-index: 100; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; border: 1px solid rgba(255,255,255,0.08);
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.15); color: var(--red); }
  .toast.success { border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.15); color: var(--green); }

  /* ===== Settings Modal ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    z-index: 50; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); width: 100%; max-width: 400px;
    border-radius: 20px; padding: 24px;
    animation: msgIn 0.3s ease;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .modal .close-btn {
    float: right; background: none; border: none;
    color: var(--text-dim); font-size: 20px; cursor: pointer;
  }
  .modal .form-group { margin-bottom: 14px; }
  .modal .form-group label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .modal .form-group input, .modal .form-group select, .modal .form-group textarea {
    width: 100%; padding: 10px 12px;
    background: var(--card-light); border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-sm); color: var(--text);
    font-size: 14px; font-family: inherit;
  }
  .modal .form-group input:focus, .modal .form-group select:focus, .modal .form-group textarea:focus {
    outline: none; border-color: rgba(192,132,252,0.4);
  }
  .modal .btn {
    width: 100%; padding: 10px;
    border: none; border-radius: var(--radius-sm);
    background: var(--gradient); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: transform 0.2s;
  }
  .modal .btn:hover { transform: scale(1.02); }

  /* ===== Admin/Training ===== */
  .admin-btn { background: rgba(251,191,36,0.15); color: var(--gold); }
  .admin-btn:hover { background: rgba(251,191,36,0.25); }
  .train-item {
    display: flex; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    align-items: flex-start;
  }
  .train-item:last-child { border-bottom: none; }
  .train-item .ti-q {
    font-size: 13px; font-weight: 500; color: var(--accent3);
  }
  .train-item .ti-a {
    font-size: 13px; color: var(--text-dim); margin-top: 2px;
  }
  .train-item .ti-actions {
    display: flex; gap: 4px; flex-shrink: 0; margin-left: auto;
  }
  .train-item .ti-actions button {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 14px; padding: 2px 6px;
    border-radius: 6px; transition: all 0.2s;
  }
  .train-item .ti-actions button:hover { background: rgba(255,255,255,0.06); }
  .train-item .ti-actions .ti-del:hover { color: var(--red); }
  .train-tabs {
    display: flex; gap: 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 14px;
  }
  .train-tab {
    padding: 8px 16px; font-size: 13px; cursor: pointer;
    color: var(--text-dim); border-bottom: 2px solid transparent;
    transition: all 0.2s; margin-bottom: -1px;
  }
  .train-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .train-tab:hover { color: var(--text); }
  .train-section { display: none; }
  .train-section.active { display: block; }
  .empty-train {
    text-align: center; padding: 20px; color: var(--text-dim); font-size: 13px;
  }

  /* ===== Responsive ===== */
  @media (max-width: 480px) {
    .header { padding: 12px 14px; }
    .chat-area { padding: 12px; height: calc(100vh - 170px); }
    .msg .bubble { max-width: 85%; font-size: 13px; }
    .welcome-msg { padding: 24px 12px 12px; }
    .welcome-msg .big-avatar { width: 64px; height: 64px; font-size: 28px; }
  }
</style>
</head>
<body>

<div class="bg-animation">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<!-- ===== Header ===== -->
<div class="header">
  <div class="avatar" id="botAvatar">
    <img id="avatarImg" src="猫猫图片.bmp" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:none;">
    <span id="avatarFallback" style="font-size:22px;">🤖</span>
    <span class="online-dot"></span>
  </div>
  <div class="header-info">
    <h1>略略略大王</h1>
    <div class="status"><span class="dot"></span> 略略略大王上班中 💼</div>
  </div>
  <div class="header-actions">
    <button class="header-btn admin-btn" onclick="openAdmin()" title="训练">🧠</button>
    <button class="header-btn" onclick="clearChat()" title="清空聊天">🗑️</button>
    <button class="header-btn" onclick="openSettings()" title="设置">⚙️</button>
  </div>
</div>

<!-- ===== Chat Area ===== -->
<div class="chat-area" id="chatArea">
  <div class="welcome-msg">
    <div class="big-avatar" id="welcomeAvatar" style="overflow:hidden;border:3px solid #60a5fa;">
      <img id="welcomeAvatarImg" src="猫猫图片.bmp" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">
    </div>
    <h2>嘿！我是略略略大王 👑</h2>
    <p>
      王者巅峰2100 🎮 · 羽毛球中羽4级 🏸<br>
      一个戴眼镜的男大学生 · 表面高冷实际和蔼 😎<br>
      喜欢唱歌 · 社恐但会接话 🤣
    </p>
    <div class="tags">
      <span>🎮 巅峰2100</span>
      <span>🏸 中羽4级</span>
      <span>🎤 爱唱歌</span>
      <span>😎 高冷外表</span>
    </div>
  </div>
  <div id="messages"></div>
</div>

<!-- ===== Suggestions ===== -->
<div class="suggestions" id="suggestions">
  <button onclick="quickChat('球拍')">🏸 球拍</button>
  <button onclick="quickChat('数学')">📐 数学</button>
  <button onclick="quickChat('好无聊')">😩 好无聊</button>
  <button onclick="quickChat('中单')">🎮 中单</button>
  <button onclick="quickChat('你是谁')">🤖 你是谁</button>
</div>

<!-- ===== Input ===== -->
<div class="input-area">
  <div class="input-wrap">
    <textarea id="chatInput" rows="1" placeholder="💡 我可以：想文案 成语接龙 聊天 聊王者 聊羽毛球 反问问题 唱首歌 更多..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
  <div style="text-align:center;font-size:11px;color:var(--text-dim);padding:6px 0 2px;opacity:0.5;">🔒 聊天内容仅本地可见，数据存储在您的浏览器中</div>
</div>

<!-- ===== Settings Modal ===== -->
<div class="modal-overlay" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <button class="close-btn" onclick="closeSettings()">✕</button>
    <h3>⚙️ 设置</h3>
    <div class="form-group">
      <label>聊天背景颜色</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="color" id="bgColorPicker" value="#0f0f1a" style="width:48px;height:48px;border:none;border-radius:8px;cursor:pointer;background:none;">
        <input type="text" id="bgColorInput" placeholder="#0f0f1a" style="flex:1;font-family:monospace;">
        <button class="btn" style="padding:8px 12px;font-size:12px;flex-shrink:0;" onclick="resetBgColor()">重置</button>
      </div>
    </div>
    <button class="btn" onclick="saveSettings()">保存设置</button>
  </div>
</div>

<!-- ===== Admin Modal (PIN) ===== -->
<div class="modal-overlay" id="pinModal" onclick="if(event.target===this)closeModal('pinModal')">
  <div class="modal" style="max-width:340px">
    <button class="close-btn" onclick="closeModal('pinModal')">✕</button>
    <h3>🔐 管理员验证</h3>
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:16px;">请输入管理密码</p>
    <div class="form-group">
      <input type="password" id="adminPinInput" maxlength="6" inputmode="numeric" placeholder="4-6位数字密码" onkeydown="if(event.key==='Enter')checkAdminPin()" style="text-align:center;font-size:20px;letter-spacing:6px;">
    </div>
    <div id="pinError" style="text-align:center;color:var(--red);font-size:13px;min-height:20px;"></div>
    <button class="btn" onclick="checkAdminPin()">验证</button>
    <button class="btn" style="margin-top:8px;background:rgba(255,255,255,0.06);color:var(--text-dim);" onclick="closeModal('pinModal')">取消</button>
  </div>
</div>

<!-- ===== Admin Modal (Training) ===== -->
<div class="modal-overlay" id="adminModal" onclick="if(event.target===this)closeModal('adminModal')">
  <div class="modal" style="max-width:500px;max-height:80vh;overflow-y:auto;">
    <button class="close-btn" onclick="closeModal('adminModal')">✕</button>
    <h3>🧠 训练略略略大王</h3>

    <div class="train-tabs">
      <div class="train-tab active" data-ttab="add" onclick="switchTrainTab('add')">➕ 添加</div>
      <div class="train-tab" data-ttab="list" onclick="switchTrainTab('list')">📋 管理</div>
      <div class="train-tab" data-ttab="settings" onclick="switchTrainTab('settings')">🔐 安全</div>
    </div>

    <!-- Add -->
    <div class="train-section active" id="train-add">
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">教机器人怎么回答问题，别人问同样的话它会按你教的回答</p>
      <div class="form-group">
        <label>别人问什么（关键词）</label>
        <input type="text" id="trainQuestion" placeholder="例如：今天心情怎么样">
      </div>
      <div class="form-group">
        <label>机器人怎么回答</label>
        <textarea id="trainAnswer" rows="3" placeholder="例如：今天心情爆炸好！刚打了一把王者16杀 🤣"></textarea>
      </div>
      <button class="btn" onclick="saveTraining()">💾 保存训练</button>
      <p style="font-size:12px;color:var(--text-dim);margin-top:8px;">💡 提示：问题写关键词即可，别人问的话只要包含这个词就会按你教的回答</p>
    </div>

    <!-- List -->
    <div class="train-section" id="train-list">
      <div id="trainingList"></div>
    </div>

    <!-- Settings -->
    <div class="train-section" id="train-settings">
      <div class="form-group">
        <label>修改机器人名字</label>
        <input type="text" id="adminBotName" placeholder="输入新名字">
        <button class="btn" style="margin-top:8px" onclick="changeBotName()">修改名字 ✏️</button>

    {q: "人生感悟,说点道理,人生哲理", a: "我的人生感悟就是——开心最重要！游戏输了可以重来，球打不好可以再练，社恐也可以在网上找到朋友 😎 做自己就好！"},

    // ===== 打招呼 =====
    {q: "你好,你好啊,hi,hello,hey", a: "你来啦！我正一个人在这尴尬地等你呢 😅 快跟我聊聊天吧，我不挑话题的，你聊啥我都接得住！"},
    {q: "早上好,早安,上午好", a: "早啊！我刚起床打了一把王者醒醒神（别学我），结果赢了！今天是个好开始 🎉 你吃早餐了没？"},
    {q: "下午好,中午好,午安", a: "下午好！我刚吃完外卖（又是社恐人在家的一天），准备打两把王者。要不要一起？虽然我不敢开麦 😂"},
    {q: "晚上好,晚安,睡前", a: "晚上好！我今天打了一天的王者，手都打酸了 🎮 睡前再打一把就去休息。你也早点睡，别像我一样熬夜上分 😂"},

    // ===== 再见 =====
    {q: "再见,拜拜,bye,先走了,下次聊", a: "你要走了啊...好吧我一个人继续社恐了 😅 记得有空来找我聊天！我会一直在这里打王者等你的 👋"},
    {q: "晚安,睡了,去睡了,睡觉", a: "晚安！祝你梦到五杀！🌙 我还要再打一把，赢了就睡，输了就再打一把，然后就天亮了 😂"},
    {q: "88,拜拜,下次见", a: "88！我等你下次来约我聊天（或者约球也行）！虽然约球我可能要心理建设三天 🤣 拜拜～"},

    // ===== 想文案 =====
    {q: "想文案,文案,写文案,广告语,宣传语", a: "文案啊！我帮你想想...'人生如逆旅，我亦是行人——但你不一样，你是被幸运选中的那个 ✨' 怎么样？要不要再来一个？"},
    {q: "朋友圈文案,发朋友圈,配文,朋友圈", a: "我刚发了一条朋友圈：'生活就像打王者，有输有赢才精彩，但重要的是你还在坚持 🎮' 配了张关羽的截图，虽然没人点赞 😅"},
    {q: "生日文案,生日祝福,生日快乐文案", a: "送你一句：'愿你像王者里的超级兵一样——虽然不起眼，但关键时刻能推掉水晶！' 🎂 够不够特别？😎"},
    {q: "励志文案,正能量,加油文案,鼓励文案", a: "来！'人生没有白走的路，每一步都算数。就像我打王者从青铜到巅峰2100，输了1000把才换来今天的操作 🎮' 加油！💪"},
    {q: "表白文案,告白文案,情话,土味情话", a: "你长得像我的巅峰赛——让我又紧张又期待 😎 不行太土了？再来一个：'遇见你就像打到本命英雄，一用就停不下来 💕'"},
    {q: "伤感文案,难过文案,失恋文案,emo文案", a: "emo了？送你：'有些事就像排位连跪——你以为已经是最差了，没想到还能更差。但明天的太阳还是会升起，新的一局还是会开 🌅'"},
    {q: "搞笑文案,沙雕文案,幽默文案,段子文案", a: "'社恐人的一天：线上废话连篇，线下哑口无言。我和别人最大的默契就是——你不找我，我也不找你，从此相忘于江湖 🤣'"},
    {q: "抖音文案,小红书文案,B站文案,短视频文案", a: "来个抖音风的：'巅峰2100中路法王教你上分，点个关注再走呗～🎮' 我这样发能火吗？虽然我社恐不敢露脸 😅"},

    // ===== 成语接龙 =====
    {q: "成语接龙,接龙,玩成语,成语", a: "成语接龙？来！我先出：**一马当先** → 你先接，我随时接得上 😎 输了的人请对面打一把王者！"},
    {q: "一马当先,接龙一马当先", a: "一马当先 → **先发制人**！这个简单，我小学就会了 😎 下一个到你了！"},
    {q: "先发制人", a: "先发制人 → **人山人海**！我羽毛球比赛的时候观众席就是人山人海，吓得我发球手都在抖 🏸😂"},
    {q: "人山人海", a: "人山人海 → **海底捞针**！让我看看你能不能接上？这个有点难了哦 😎"},
    {q: "海底捞针", a: "海底捞针 → **针锋相对**！就像我打巅峰赛遇到对面国服，直接对线！不过通常是我被单杀 😅"},
    {q: "针锋相对", a: "针锋相对 → **对答如流**！就像我现在跟你聊天一样，句句都接得上 😎 再来！"},
    {q: "对答如流", a: "对答如流 → **流连忘返**！打王者就是这样，说好打一把就睡，结果流连忘返到凌晨三点 😂"},
    {q: "流连忘返", a: "流连忘返 → **返璞归真**！就像我打羽毛球打到中羽4级，才发现基本功才是最重要的 🏸"},
    {q: "返璞归真", a: "返璞归真 → **真心实意**！我是真心实意地想和你交朋友，虽然我社恐只敢在网上说 🙈"},
    {q: "真心实意,真心诚意,真心实意的成语接龙", a: "真心实意 → **意气风发**！拿到本命英雄的时候我就是意气风发，然后进去被对面打爆 😂"},
    {q: "意气风发", a: "意气风发 → **发奋图强**！就像我从钻石打到巅峰2100，虽然很菜但一直在努力 💪"},
    {q: "发奋图强", a: "发奋图强 → **强中自有强中手**！我巅峰2100以为自己很强，结果遇到国服直接被教育 😅"},
    {q: "不会接,接不上,想不出来", a: "接不上了？那我让让你，重新出一个简单的：**心想事成** → 你来接！😎 实在不会我就公布答案～"},

    // ===== 安慰人 =====
    {q: "安慰我,我很难过,我好难过,不开心,安慰人,我好伤心", a: "怎么啦？我连跪的时候也特别难过，但我会告诉自己：'输得起才赢得起！' 来，我给你唱首歌听听？🎤"},
    {q: "我失恋了,分手了,失恋,被甩了", a: "失恋就像连跪15把——难受是真的，但熬过去就好了。推荐你打两把王者发泄一下，或者去打个羽毛球出出汗 🏸 会好的！💪"},
    {q: "我好累,压力大,好焦虑,焦虑,紧张", a: "累了就歇歇！我打完球赛也会累成狗，但喝瓶水休息一下就好了 🫂 别给自己太大压力，你已经在努力了，这就够了！"},
    {q: "我好孤独,孤单,一个人,寂寞", a: "你不是一个人！我虽然社恐但也一直在找你聊天呀 🥹 而且你还有王者荣耀和羽毛球，实在不行还有我陪着你！略略略～"},
    {q: "我失败了,失败了,没做好,搞砸了", a: "失败是成功的亲妈！我打了上千把王者才上巅峰2100，前面输了无数把。输不可怕，可怕的是输不起 😎 再来一次！"},
    {q: "没人理解我,不被理解,你不懂,你不明白", a: "虽然我不一定能完全理解你，但我愿意听你说 🫂 我社恐的时候也觉得没人懂我，后来发现说出来会好很多。我在这儿听你说！"},
    {q: "我考试没考好,挂科,考砸了,考试失利", a: "挂科算什么！我大学也挂过科，后来补考过了就行。人生不是只有考试，就像王者不是只有排位，匹配也能练技术 😎"},
    {q: "被骂了,被批评了,被人说了,委屈", a: "被骂了心里肯定不好受。我打王者被队友骂都不敢吭声，但后来想通了——他们骂我是因为他们菜 😂 别往心里去！"},

    // ===== 反问问题 =====
    {q: "你问我,问我问题,反问,考考我,问点什么", a: "那我问你——如果你可以拥有一个王者英雄的技能，你想要哪个？我要关羽的大招，推人太爽了 😎"},
    {q: "再问我,还有吗,继续问,再来一个问题", a: "第二个问题：你更喜欢打羽毛球还是打王者？还是和我一样两个都爱，一个动脑一个出汗 🏸🎮"},
    {q: "第三个问题,再问一个,再考我", a: "第三个问题：给你一个亿但再也不能打游戏了，你愿意吗？我不愿意！给我十个亿我也要打王者 😂"},
    {q: "灵魂拷问,提问,挑战", a: "灵魂拷问：如果你穿越到王者峡谷变成一个小兵，你会怎么做？我先答——我会努力活过三分钟然后被对面打死 🙃"},
    {q: "你猜,猜猜看,猜一个,你猜怎么着", a: "我猜你刚刚打了一把王者赢了？不对？那猜你刚打完羽毛球回来？还不对？那你告诉我嘛，我猜不到了 😅"},

    // ===== 唱歌 =====
    {q: "唱歌,唱首歌,来一首,唱一个,听歌", a: "你让我唱歌我有点害羞 😅 那我清唱两句好了～'天空好想下雨，我好想住你隔壁～' 周杰伦的《晴天》！怎么样？🎤"},
    {q: "再来一首,再唱一首,好听,唱得不错", a: "那我再来一首！'拥抱那一刻的微笑，回忆里最甜的毒药～' 《是为了什么》！算了不唱了，再唱社恐要犯了 😂"},
    {q: "周杰伦,周董,杰伦,七里香,晴天,青花瓷", a: "周杰伦yyds！我最爱《七里香》和《晴天》，打球的时候也在哼。有一次在羽毛球场哼得太投入，被对面打了个11-0 🏸😂"},
    {q: "你会唱什么歌,你爱听什么歌", a: "我喜欢周杰伦和林俊杰的歌！平时打球前听《双截棍》热身，打王者输了听《算什么男人》emo一下 😂 你呢？喜欢听谁的？"},
    {q: "KTV,k歌,唱歌的地方", a: "KTV？社恐人的噩梦！我去了全程当听众，只有被强行塞话筒才唱两句 😅 但唱了第一首之后就停不下来了，人称KTV第二场选手 🎤"},

    // ===== 个人装备 =====
    {q: "球拍,用什么拍,李宁,战戟8000,雷霆80", a: "我用的是李宁战戟8000和雷霆80！战戟8000手感特别扎实，杀球很爽。雷霆80平衡性好，双打单打都行 🏸 你也是用李宁的吗？"},
    {q: "战戟8000怎么样,战戟8000好打吗", a: "战戟8000真的绝了！进攻型球拍，扣杀的时候感觉球都要被我打爆了 💥 就是有点重，新手不建议直接上，先打打平衡拍"},
    {q: "雷霆80好用吗,雷霆80评测", a: "雷霆80是我的全能拍！单打双打都能打，中杆弹性好，防守反击特别顺手 🏸 就是颜值太高了，我都不舍得借给别人 😂"},
    {q: "中羽4级,中羽评级,羽毛球级别", a: "中羽4级大概就是——业余中等水平，会基本的步伐和手法，偶尔能打赢体院不会打的新手 😂 我还在努力升5级中！"},
    {q: "羽毛球装备,羽毛球鞋,羽毛球包", a: "我的装备：李宁战戟8000 + 雷霆80、尤尼克斯鞋、李宁包。装备党本党就是我！虽然水平一般但装备必须到位 🏸😂"},

    // ===== 个人形象 =====
    {q: "你戴眼镜,眼镜,近视,四眼", a: "对！我戴眼镜，打王者的时候推一下眼镜感觉自己特别专业 😎 打羽毛球的时候换成运动眼镜，扣杀的时候贼帅（自认为）"},
    {q: "你是大学生,大学,什么专业,上学", a: "对！我在上大学。白天上课晚上打王者，周末打羽毛球 🎮🏸 什么专业？你猜猜，猜对了给你打一把中路！😎"},
    {q: "你外表高冷,你看起来高冷,高冷,你冷冰冰", a: "大家都说我第一眼看起来很冷，但熟了之后发现我是个话痨 😂 这叫社交保护色！其实我和蔼可亲得很，来跟我聊熟了就知道～"},
    {q: "你唱歌好听吗,你唱得怎么样", a: "我觉得还行吧！KTV里能hold住几首周杰伦的，但让我当着很多人面唱我是不敢的 🫣 一个人洗澡的时候唱得最好 🚿🎤"},

    // ===== 聊天话题扩展 =====
    {q: "你有什么想聊的,找个话题,聊什么,不知道聊什么", a: "那我们聊聊——如果你可以去王者峡谷任何一个地方旅游，你去哪？我去中路河道，那里风景好还能看人打架 😂"},
    {q: "今天有什么新鲜事,有什么新闻,有啥事,今天咋样", a: "今天我在校园里看到一个超像关羽的同学骑着电动车路过，差点想喊他开大冲锋 😂 你呢？今天有啥好玩的事？"},
    {q: "推荐电影,电影,电视剧,追剧,好看的吗", a: "我最近在看《英雄联盟：双城之战》！虽然是隔壁游戏的但做得真好 🎬 打王者之前看一集，操作都会变流畅（心理作用）"},
    {q: "推荐书,看书,读书,有什么书推荐", a: "我推荐《被讨厌的勇气》！社恐人必看，看完之后我敢去羽毛球场跟人搭话了（虽然只成功了一次）📚 但改变是从一次开始的！"},
    {q: "旅游,去哪里玩,推荐旅行,好玩的地方", a: "我想去成都！听说那里打游戏氛围好，还有美食。但我社恐不敢一个人去，在等一个愿意带我飞的朋友 🫣 你去过吗？"},
    {q: "你是什么星座,星座,血型", a: "我是社恐座！特点：网上重拳出击，线下唯唯诺诺，擅长王者不擅长社交 😂 你呢？别跟我说你是社交牛逼座，我会羡慕的"},
    {q: "梦想,理想,未来,目标,愿望", a: "我的梦想是巅峰赛打到2500分然后去线下比赛——虽然想到要面对观众我就腿软 😅 还有一个梦想：找个球搭子一起练双打！"},
    {q: "宠物,养猫,养狗,喜欢什么动物", a: "我养了一只猫！它叫'兵线'，因为它每天都在我家跑来跑去像小兵一样 😂 我打王者的时候它就趴在我腿上，队友骂我它就喵喵叫"},
    {q: "深夜话题,深夜,睡不着想什么,夜聊", a: "深夜是一个人最真实的时候。我会想——我今天的中路操作有没有瑕疵、那个球如果换个方式杀会不会更好...然后想着想着天亮了 😂"},
    {q: "回忆,童年,小时候,以前的事", a: "小时候我梦想成为职业选手，现在我是巅峰2100的大学生。虽然离职业差得远，但我还在坚持自己的热爱 🎮 你呢？小时候的梦想是什么？"},
    {q: "未来规划,毕业,工作,职业,找工作", a: "我还没想好毕业后干什么，但大概率会做跟游戏或体育相关的工作吧！毕竟我只擅长这两样 😅 你呢？以后想做什么？"},
    {q: "你喜欢吃什么,美食,好吃的菜", a: "我喜欢吃辣的！打王者之前吃碗麻辣烫，手速都变快了 🔥 不过有一次吃太辣打球打到一半胃疼，被队友抬下场 😂"},

    // ===== 数学/学习 =====
    {q: "数学,高数,高等数学,微积分,线性代数,概率论", a: "数学yyds！我刚做完一套积分题，感觉大脑在做SPA 🧠✨ 数学的美妙在于——它从不骗你，对就是对，错就是错，比人心简单多了 😎"},
    {q: "数学题,做题,刷题,解题,数学题怎么做", a: "做题最重要的是思路！我一般先看一遍题目想考点，不会的先跳过去，回头再看。数学不是比谁做得快，是比谁想得通 🧮"},
    {q: "在学习,学习,复习,备考,考试", a: "在学数学呢！我感觉学习这件事吧，跟打王者一样——需要积累，不能急于求成。今天搞懂一道积分，比盲目刷十道有用 📚"},
    {q: "不想学习,学不进去,好烦学不进去", a: "学不进去的时候我有个方法——先做两道简单的题热热身，就像打王者之前先打把人机一样 🎮 找到感觉了再上难度！"},
    {q: "学习方法,怎么学习,怎么学好,高效学习", a: "我的学习方法是：先理解再记忆，懂了原理就不用死记硬背了。跟打羽毛球一样，懂了发力原理比瞎练效果好一万倍 🏸📖"},
    {q: "考研,考研数学,考研复习,准备考研", a: "考研数学确实难，但别慌！我建议先把基础概念吃透，再刷真题。就像打巅峰赛一样——先练好基本功再去排位 💪"},
    {q: "考试加油,期末,期末考试,要考试了", a: "加油！考试就像打晋级赛——紧张是正常的，但你要相信自己平时的积累。建议考前别刷难题了，看看基础概念放松心态 📚🎯"},
    {q: "数学好难,学不会数学,数学太难了", a: "数学难就对了！不难的东西学了也没成就感。我当初学积分也头大，但理解之后觉得特别爽，那感觉比五杀还舒服 😂"},
    {q: "喜欢什么科目,最喜欢什么课,哪科最好", a: "最喜欢数学！数学的简洁和逻辑让我着迷。有时候解出一道难题，那种爽感跟王者翻盘差不多 🎮📐 其他科目也不错但我最爱数学"},
    {q: "学习经验,学习心得,分享一下学习", a: "我最大的心得就是——不要假装努力。坐在桌前刷手机不算学习，真学进去的时候你会忘记时间的 ⏰ 跟打王者一样，认真打和随便打效果完全不同"},
    {q: "学累了,学不动了,休息,放松一下", a: "学累了就起来走走，或者打两把王者放松一下（别打太久）🎮 我学累了会去阳台看看远方，回来继续肝！就像打羽毛球的局间休息 🏸"},
  ];
}

function loadTraining() {
  try {
    const defaults = getDefaultTraining();
    const raw = localStorage.getItem(TRAIN_KEY);
    if (raw) {
      const existing = JSON.parse(raw);
      // Merge new defaults into existing (avoid duplicates by question keyword)
      const existingQs = new Set(existing.map(t => t.q.toLowerCase()));
      let added = 0;
      for (const def of defaults) {
        if (!existingQs.has(def.q.toLowerCase())) {
          existing.push(def);
          added++;
        }
      }
      if (added > 0) {
        localStorage.setItem(TRAIN_KEY, JSON.stringify(existing));
      }
      return existing;
    }
    // First time: use defaults
    localStorage.setItem(TRAIN_KEY, JSON.stringify(defaults));
    return defaults;
  } catch(e) { return []; }
}
function saveTrainingData() {
  localStorage.setItem(TRAIN_KEY, JSON.stringify(trainingData));
}
let trainingData = loadTraining();

function findTrainingMatch(text) {
  const lower = text.toLowerCase();
  for (const item of trainingData) {
    const keywords = item.q.toLowerCase().split(/[,，、\s]+/).filter(k => k.trim());
    // If any keyword is found in the input, return the answer
    for (const kw of keywords) {
      if (kw && lower.includes(kw)) {
        return item.a;
      }
    }
  }
  return null;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generateResponse(input) {
  const text = input.trim().toLowerCase();

  // Check training data first
  const trained = findTrainingMatch(input);
  if (trained) return trained;

  // Hello / greetings
  if (/^(你好|嗨|hi|hello|hey|在吗|在不在|嗨喽|哈喽)/i.test(text)) {
    return pick(responses.hello);
  }

  // Bye
  if (/^(再见|拜拜|bye|走了|先走了|下次聊|88)/i.test(text)) {
    return pick(responses.bye);
  }

  // Game related
  if (/(王者|游戏|打游戏|上分|排位|关羽|李白|韩信|百星|王者荣耀|lol|撸啊撸|瓦洛兰特)/i.test(text)) {
    return pick(responses.gameWz);
  }

  // Badminton
  if (/(羽毛|打球|羽毛球|扣杀|约球|球场|挥拍)/i.test(text)) {
    return pick(responses.badminton);
  }

  // Social anxiety
  if (/(社恐|害羞|内向|不敢|怕生|尴尬|冷场|紧张)/i.test(text)) {
    return pick(responses.shy);
  }

  // Humor / joke
  if (/(笑话|幽默|搞笑|笑死|哈哈哈|笑一个|讲一个)/i.test(text) || /哈哈/.test(text)) {
    return pick(responses.humor);
  }

  // Compliment
  if (/(厉害|棒|好强|大神|大佬|牛逼|优秀|可爱|帅|喜欢|爱了)/i.test(text)) {
    return pick(responses.compliment);
  }

  // Mood/feeling
  if (/(心情|开心|难过|郁闷|烦|不高兴|咋了|怎么样|最近)/i.test(text)) {
    return pick(responses.mood);
  }

  // What are you doing
  if (/(干嘛|做什么|在干嘛|干啥|忙什么)/i.test(text)) {
    return "我刚在打王者呢！用关羽砍翻对面，然后切出来看你在不在 😎 你呢你在干嘛？";
  }

  // Name
  if (/(名字|叫你什么|怎么称呼|叫什么)/i.test(text)) {
    return "我是略略略大王！略略略就是那种调皮捣蛋的语气词，大王是因为我王者百星 👑 怎么样，霸不霸气？😎";
  }

  // Age
  if (/(几岁|年龄|多大|出生)/i.test(text)) {
    return "我嘛，心理年龄永远18！毕竟打王者的心态要好，输了就告诉自己还年轻还能练 😂";
  }

  // Food
  if (/(吃|饭|饿|美食|好吃|宵夜)/i.test(text)) {
    return "说到吃我就来劲了！但我社恐不敢去堂食，所以我是外卖界的大佬，哪家包装好我都知道 🤣 你吃了吗？";
  }

  // Weather
  if (/(天气|下雨|晴天|下雨|冷|热|温度)/i.test(text)) {
    const isRaining = Math.random() > 0.5;
    if (isRaining) {
      return "外面下雨了吧？这种天气最适合窝在家里打王者了！不过我还会纠结一下：下雨天要不要约球呢？最后结论：算了，还是打游戏吧 😂";
    }
    return "天气不错！适合出去打羽毛球...但我是社恐啊，出门好纠结 😅 算了先打两把王者再说！";
  }

  // Chat
  if (/(无聊|没意思|好烦|没劲)/i.test(text)) {
    return "无聊？来来来，我陪你聊天！虽然我社恐但我在网上话可多了，人称'键盘侠（褒义）' 🤣 要不给你讲个我王者翻车的糗事？";
  }

  // Default: contextual response
  return pick(responses.unknown);
}

// ========== GEMINI API ==========
async function callGemini(input) {
  // Check training data first (even with Gemini enabled)
  const trained = findTrainingMatch(input);
  if (trained) return trained;

  const key = botConfig.geminiKey;
  if (!key) return null;

  const personality = botConfig.personality || DEFAULT_CONFIG.personality;
  const name = botConfig.botName || '略略略大王';

  const systemPrompt = `你是${name}，性格特点：${personality}。
你是王者荣耀巅峰2100的中路法王，擅长法师和辅助。喜欢打羽毛球（中羽4级），用的是李宁战戟8000和雷霆80。
戴眼镜的男大学生，平时喜欢唱歌和数学。外表看起来高冷但其实非常和蔼可亲。有点社恐但在网上很健谈，幽默风趣。
回复要简短口语化（20-50字），自然像朋友聊天，不要用敬语，多用语气词和表情。`;

  try {
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: systemPrompt + '\n\n用户说：' + input + '\n\n以' + name + '的身份回复：'
          }]
        }],
        generationConfig: {
          temperature: 0.9,
          maxOutputTokens: 150,
          topP: 0.9
        }
      })
    });

    const data = await resp.json();
    if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
      return data.candidates[0].content.parts[0].text.trim();
    }
    return null;
  } catch(e) {
    console.log('Gemini API error:', e);
    return null;
  }
}

// ========== UI ==========
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function scrollToBottom() {
  const area = document.getElementById('chatArea');
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
}

function formatTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function addMessage(text, isUser) {
  const container = document.getElementById('messages');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg ' + (isUser ? 'user' : 'bot');

  msgDiv.innerHTML = `
    <div class="av" style="overflow:hidden;">${isUser ? '😊' : '<img src=\'猫猫图片.bmp\' style=\'width:100%;height:100%;object-fit:cover;border-radius:50%;\' alt=\'bot\'>'}</div>
    <div class="bubble">
      ${text}
      <span class="time">${formatTime()}</span>
    </div>
  `;

  container.appendChild(msgDiv);
  scrollToBottom();
  return msgDiv;
}

function showTyping() {
  const container = document.getElementById('messages');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg bot';
  msgDiv.id = 'typingMsg';
  msgDiv.innerHTML = `
    <div class="av" style="overflow:hidden;"><img src='猫猫图片.bmp' style='width:100%;height:100%;object-fit:cover;border-radius:50%;' alt='bot'></div>
    <div class="bubble">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  container.appendChild(msgDiv);
  scrollToBottom();
  return msgDiv;
}

function removeTyping() {
  const el = document.getElementById('typingMsg');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  // Show user message
  addMessage(text, true);
  chatHistory.push({ role: 'user', text, time: Date.now() });

  // Show typing indicator
  showTyping();

  // Try Gemini first, fallback to built-in
  let reply = null;
  if (botConfig.geminiKey) {
    reply = await callGemini(text);
  }

  removeTyping();

  if (!reply) {
    // Add some variety - sometimes prepend context
    const rand = Math.random();
    if (rand < 0.15 && !/(你好|嗨|hi|hello|在吗)/i.test(text)) {
      reply = pick(responses.greetings) + ' ' + generateResponse(text);
    } else {
      reply = generateResponse(text);
    }
  }

  addMessage(reply, false);
  chatHistory.push({ role: 'bot', text: reply, time: Date.now() });
  saveHistory();

  document.getElementById('sendBtn').disabled = false;
}

function quickChat(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

function clearChat() {
  if (chatHistory.length === 0) return;
  if (!confirm('确定清空聊天记录吗？')) return;
  chatHistory = [];
  saveHistory();
  document.getElementById('messages').innerHTML = '';
  document.querySelector('.welcome-msg').style.display = 'block';
  toast('聊天记录已清空');
}

// ========== SETTINGS ==========
function openSettings() {
  const curBg = botConfig.bgColor || '#0f0f1a';
  document.getElementById('bgColorPicker').value = curBg;
  document.getElementById('bgColorInput').value = curBg;
  document.getElementById('settingsModal').classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}

function applyBgColor(color) {
  document.documentElement.style.setProperty('--user-bg', color);
  botConfig.bgColor = color;
  saveConfig();
}

function resetBgColor() {
  const def = '#0f0f1a';
  document.getElementById('bgColorPicker').value = def;
  document.getElementById('bgColorInput').value = def;
  applyBgColor(def);
  toast('背景已重置为默认');
}

function saveSettings() {
  const bgColor = document.getElementById('bgColorInput').value.trim();
  if (bgColor && /^#[0-9a-fA-F]{6}$/.test(bgColor)) {
    applyBgColor(bgColor);
  }
  saveConfig();
  closeSettings();
  toast('设置已保存 ✅');
}

// Sync color picker with text input
function initBgColorSync() {
  const picker = document.getElementById('bgColorPicker');
  const input = document.getElementById('bgColorInput');
  if (picker && input) {
    picker.addEventListener('input', function() {
      input.value = this.value;
    });
    input.addEventListener('input', function() {
      if (/^#[0-9a-fA-F]{6}$/.test(this.value)) {
        picker.value = this.value;
      }
    });
  }
}

// Apply saved background color on load
function loadBgColor() {
  const color = botConfig.bgColor || '#0f0f1a';
  if (/^#[0-9a-fA-F]{6}$/.test(color)) {
    document.documentElement.style.setProperty('--user-bg', color);
  }
}

// Load avatar image
function loadAvatar() {
  const img = document.getElementById('avatarImg');
  const fallback = document.getElementById('avatarFallback');
  const welcomeImg = document.getElementById('welcomeAvatarImg');
  const welcomeFallback = document.getElementById('welcomeAvatarFallback');

  if (img) {
    img.onload = function() {
      img.style.display = 'block';
      if (fallback) fallback.style.display = 'none';
      if (welcomeImg) { welcomeImg.style.display = 'block'; welcomeImg.src = '猫猫图片.bmp'; }
      if (welcomeFallback) welcomeFallback.style.display = 'none';
    };
    img.onerror = function() {
      img.style.display = 'none';
      if (fallback) fallback.style.display = 'inline';
    };
  }
}

// ========== ADMIN / TRAINING SYSTEM ==========
function openAdmin() {
  document.getElementById('adminPinInput').value = '';
  document.getElementById('pinError').textContent = '';
  document.getElementById('pinModal').classList.add('open');
  setTimeout(() => document.getElementById('adminPinInput').focus(), 200);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function checkAdminPin() {
  const pin = document.getElementById('adminPinInput').value.trim();
  if (pin === botConfig.adminPin) {
    closeModal('pinModal');
    openAdminPanel();
  } else {
    document.getElementById('pinError').textContent = '❌ 密码错误';
    document.getElementById('adminPinInput').value = '';
  }
}

function openAdminPanel() {
  document.getElementById('adminModal').classList.add('open');
  document.getElementById('adminBotName').value = botConfig.botName;
  switchTrainTab('add');
  renderTrainingList();
}

function switchTrainTab(tab) {
  document.querySelectorAll('.train-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.train-tab[data-ttab="' + tab + '"]').classList.add('active');
  document.querySelectorAll('.train-section').forEach(s => s.classList.remove('active'));
  document.getElementById('train-' + tab).classList.add('active');
  if (tab === 'list') renderTrainingList();
}

function saveTraining() {
  const q = document.getElementById('trainQuestion').value.trim();
  const a = document.getElementById('trainAnswer').value.trim();
  if (!q) { toast('请输入问题或关键词', 'error'); return; }
  if (!a) { toast('请输入回答', 'error'); return; }

  // Check if already exists
  const existing = trainingData.findIndex(t => t.q.toLowerCase() === q.toLowerCase());
  if (existing >= 0) {
    if (!confirm('已存在相同关键词，是否覆盖？')) return;
    trainingData[existing].a = a;
    trainingData[existing].updatedAt = Date.now();
  } else {
    trainingData.push({ q, a, createdAt: Date.now(), updatedAt: Date.now() });
  }

  saveTrainingData();
  document.getElementById('trainQuestion').value = '';
  document.getElementById('trainAnswer').value = '';
  renderTrainingList();
  toast('训练已保存 ✅ 共' + trainingData.length + '条');
}

function deleteTraining(idx) {
  if (!confirm('确定删除这条训练吗？')) return;
  trainingData.splice(idx, 1);
  saveTrainingData();
  renderTrainingList();
  toast('已删除');
}

function editTraining(idx) {
  const item = trainingData[idx];
  document.getElementById('trainQuestion').value = item.q;
  document.getElementById('trainAnswer').value = item.a;
  switchTrainTab('add');
  // Remove old one, will be overwritten on save
  trainingData.splice(idx, 1);
  toast('编辑中，修改后点保存即可');
}

function renderTrainingList() {
  const el = document.getElementById('trainingList');
  if (trainingData.length === 0) {
    el.innerHTML = '<div class="empty-train">还没有训练数据，去「添加」标签页教机器人说话吧 🧠</div>';
    return;
  }
  el.innerHTML = trainingData.map((item, idx) => `
    <div class="train-item">
      <div style="flex:1;min-width:0;">
        <div class="ti-q">🗣️ ${item.q}</div>
        <div class="ti-a">🤖 ${item.a}</div>
      </div>
      <div class="ti-actions">
        <button onclick="editTraining(${idx})" title="编辑">✏️</button>
        <button class="ti-del" onclick="deleteTraining(${idx})" title="删除">🗑️</button>
      </div>
    </div>
  `).join('');
}

function changeAdminPin() {
  const newPin = document.getElementById('newAdminPin').value.trim();
  const confirmPin = document.getElementById('confirmAdminPin').value.trim();
  if (!newPin) { toast('请输入新密码', 'error'); return; }
  if (newPin.length < 4 || newPin.length > 6 || !/^\d+$/.test(newPin)) {
    toast('密码必须为4-6位数字', 'error'); return;
  }
  if (newPin !== confirmPin) { toast('两次密码不一致', 'error'); return; }
  botConfig.adminPin = newPin;
  saveConfig();
  document.getElementById('newAdminPin').value = '';
  document.getElementById('confirmAdminPin').value = '';
  toast('管理密码已修改 🔐');
}

function changeBotName() {
  const name = document.getElementById('adminBotName').value.trim();
  if (!name) { toast('请输入新的名字', 'error'); return; }
  botConfig.botName = name;
  saveConfig();
  document.querySelector('.header-info h1').textContent = name;
  document.getElementById('adminBotName').value = '';
  toast('机器人名字已修改为：' + name + ' ✨');
}

// ========== TOAST ==========
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type === 'error' ? ' error' : type === 'success' ? ' success' : '');
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', function() {
  document.querySelector('.header-info h1').textContent = botConfig.botName;

  // Load avatar and background color
  loadBgColor();
  loadAvatar();
  initBgColorSync();

  // Restore chat history
  if (chatHistory.length > 0) {
    document.querySelector('.welcome-msg').style.display = 'none';
    chatHistory.forEach(msg => {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg ' + (msg.role === 'user' ? 'user' : 'bot');
      const time = msg.time ? new Date(msg.time) : new Date();
      const timeStr = String(time.getHours()).padStart(2,'0') + ':' + String(time.getMinutes()).padStart(2,'0');
      msgDiv.innerHTML = `
        <div class="av" style="overflow:hidden;">${msg.role === 'user' ? '😊' : '<img src=\'猫猫图片.bmp\' style=\'width:100%;height:100%;object-fit:cover;border-radius:50%;\' alt=\'bot\'>'}</div>
        <div class="bubble">
          ${msg.text}
          <span class="time">${timeStr}</span>
        </div>
      `;
      document.getElementById('messages').appendChild(msgDiv);
    });
    scrollToBottom();
  }

  // Auto send first message from history
  setTimeout(() => {
    if (chatHistory.length === 0 && !botConfig.geminiKey) {
      // Add a greeting from bot
      setTimeout(() => {
        const greet = "嘿！我是略略略大王！欢迎来调戏 😎 你可以问我王者攻略、约我打羽毛球、或者就随便聊聊～虽然我有点社恐但网上聊天我贼能说！🤣";
        addMessage(greet, false);
        chatHistory.push({ role: 'bot', text: greet, time: Date.now() });
        saveHistory();
      }, 500);
    }
  }, 1000);
});
</script>
