<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>略略略大王 - AI聊天</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card-light: #222244;
    --text: #e8e8f0;
    --text-dim: #8888aa;
    --accent: #ff6b9d;
    --accent2: #c084fc;
    --accent3: #60a5fa;
    --green: #4ade80;
    --gold: #fbbf24;
    --red: #f87171;
    --gradient: linear-gradient(135deg, #ff6b9d, #c084fc, #60a5fa);
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }

  /* ===== Animated Background ===== */
  .bg-animation {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }
  .bg-animation span {
    position: absolute;
    display: block;
    width: 20px;
    height: 20px;
    background: rgba(255,255,255,0.03);
    border-radius: 50%;
    animation: float 15s infinite;
    bottom: -20px;
  }
  .bg-animation span:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-delay: 0s; animation-duration: 18s; }
  .bg-animation span:nth-child(2) { left: 20%; width: 40px; height: 40px; animation-delay: 2s; animation-duration: 15s; }
  .bg-animation span:nth-child(3) { left: 30%; width: 60px; height: 60px; animation-delay: 4s; animation-duration: 20s; }
  .bg-animation span:nth-child(4) { left: 50%; width: 30px; height: 30px; animation-delay: 1s; animation-duration: 12s; }
  .bg-animation span:nth-child(5) { left: 65%; width: 50px; height: 50px; animation-delay: 3s; animation-duration: 17s; }
  .bg-animation span:nth-child(6) { left: 75%; width: 70px; height: 70px; animation-delay: 5s; animation-duration: 14s; }
  .bg-animation span:nth-child(7) { left: 85%; width: 35px; height: 35px; animation-delay: 6s; animation-duration: 16s; }
  .bg-animation span:nth-child(8) { left: 90%; width: 45px; height: 45px; animation-delay: 2.5s; animation-duration: 19s; }

  @keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.3; }
    90% { opacity: 0.1; }
    100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
  }

  /* ===== Header ===== */
  .header {
    position: relative;
    z-index: 10;
    background: rgba(15,15,26,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--gradient);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
    position: relative;
    box-shadow: 0 0 20px rgba(192,132,252,0.3);
  }
  .avatar .online-dot {
    position: absolute; bottom: 1px; right: 1px;
    width: 12px; height: 12px; background: var(--green);
    border-radius: 50%; border: 2px solid var(--bg);
  }
  .header-info { flex: 1; min-width: 0; }
  .header-info h1 {
    font-size: 17px; font-weight: 700;
    background: var(--gradient); -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; background-clip: text;
  }
  .header-info .status {
    font-size: 12px; color: var(--text-dim);
    display: flex; align-items: center; gap: 4px;
  }
  .header-info .status .dot {
    width: 6px; height: 6px; background: var(--green);
    border-radius: 50%; display: inline-block;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .header-actions { display: flex; gap: 6px; }
  .header-btn {
    background: rgba(255,255,255,0.06);
    border: none; color: var(--text-dim); width: 36px; height: 36px;
    border-radius: 50%; font-size: 16px; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  }
  .header-btn:hover { background: rgba(255,255,255,0.12); color: var(--text); }

  /* ===== Chat Messages ===== */
  .chat-area {
    position: relative; z-index: 5;
    height: calc(100vh - 140px);
    overflow-y: auto; padding: 16px;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .msg {
    display: flex; gap: 10px; margin-bottom: 16px;
    animation: msgIn 0.35s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.bot { align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }

  .msg .av {
    width: 34px; height: 34px; border-radius: 50%;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .msg.bot .av { background: var(--gradient); }
  .msg.user .av {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
  }

  .msg .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
    word-break: break-word;
    position: relative;
  }
  .msg.bot .bubble {
    background: var(--card-light);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #ff6b9d, #c084fc);
    border-bottom-right-radius: 4px;
    color: #fff;
  }

  .msg .bubble .time {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    display: block;
  }
  .msg.user .bubble .time { color: rgba(255,255,255,0.6); }

  .msg .bubble .typing-indicator {
    display: flex; gap: 4px; padding: 4px 0;
  }
  .msg .bubble .typing-indicator span {
    width: 8px; height: 8px; background: var(--text-dim);
    border-radius: 50%; animation: typing 1.4s infinite;
  }
  .msg .bubble .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .msg .bubble .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }

  /* ===== Suggestions ===== */
  .suggestions {
    display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 8px;
    position: relative; z-index: 5;
  }
  .suggestions button {
    padding: 6px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .suggestions button:hover {
    background: rgba(192,132,252,0.15);
    border-color: rgba(192,132,252,0.3);
    color: var(--text);
  }

  /* ===== Input Area ===== */
  .input-area {
    position: relative; z-index: 10;
    padding: 10px 16px 16px;
    background: rgba(15,15,26,0.9);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .input-wrap {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--card-light);
    border-radius: 20px;
    padding: 4px 4px 4px 16px;
    border: 1px solid rgba(255,255,255,0.08);
    transition: border-color 0.2s;
  }
  .input-wrap:focus-within {
    border-color: rgba(192,132,252,0.4);
    box-shadow: 0 0 20px rgba(192,132,252,0.08);
  }
  .input-wrap textarea {
    flex: 1; background: none; border: none;
    color: var(--text); font-size: 14px;
    font-family: inherit; padding: 10px 0;
    outline: none; resize: none;
    max-height: 100px; line-height: 1.5;
    min-height: 24px;
  }
  .input-wrap textarea::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--gradient); border: none;
    color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(192,132,252,0.4); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ===== Welcome ===== */
  .welcome-msg {
    text-align: center; padding: 40px 20px 20px;
    animation: msgIn 0.6s ease;
  }
  .welcome-msg .big-avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--gradient); margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; box-shadow: 0 0 30px rgba(192,132,252,0.3);
  }
  .welcome-msg h2 {
    font-size: 22px; font-weight: 700;
    background: var(--gradient); -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 8px;
  }
  .welcome-msg p {
    color: var(--text-dim); font-size: 14px; line-height: 1.8;
    max-width: 300px; margin: 0 auto;
  }
  .welcome-msg .tags {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    margin-top: 12px;
  }
  .welcome-msg .tags span {
    padding: 4px 10px; background: rgba(255,255,255,0.06);
    border-radius: 12px; font-size: 11px; color: var(--text-dim);
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    background: var(--card-light); color: var(--text);
    padding: 10px 20px; border-radius: 12px; font-size: 13px;
    z-index: 100; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; border: 1px solid rgba(255,255,255,0.08);
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.15); color: var(--red); }
  .toast.success { border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.15); color: var(--green); }

  /* ===== Settings Modal ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    z-index: 50; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); width: 100%; max-width: 400px;
    border-radius: 20px; padding: 24px;
    animation: msgIn 0.3s ease;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .modal .close-btn {
    float: right; background: none; border: none;
    color: var(--text-dim); font-size: 20px; cursor: pointer;
  }
  .modal .form-group { margin-bottom: 14px; }
  .modal .form-group label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .modal .form-group input, .modal .form-group select, .modal .form-group textarea {
    width: 100%; padding: 10px 12px;
    background: var(--card-light); border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-sm); color: var(--text);
    font-size: 14px; font-family: inherit;
  }
  .modal .form-group input:focus, .modal .form-group select:focus, .modal .form-group textarea:focus {
    outline: none; border-color: rgba(192,132,252,0.4);
  }
  .modal .btn {
    width: 100%; padding: 10px;
    border: none; border-radius: var(--radius-sm);
    background: var(--gradient); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: transform 0.2s;
  }
  .modal .btn:hover { transform: scale(1.02); }

  /* ===== Admin/Training ===== */
  .admin-btn { background: rgba(251,191,36,0.15); color: var(--gold); }
  .admin-btn:hover { background: rgba(251,191,36,0.25); }
  .train-item {
    display: flex; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    align-items: flex-start;
  }
  .train-item:last-child { border-bottom: none; }
  .train-item .ti-q {
    font-size: 13px; font-weight: 500; color: var(--accent3);
  }
  .train-item .ti-a {
    font-size: 13px; color: var(--text-dim); margin-top: 2px;
  }
  .train-item .ti-actions {
    display: flex; gap: 4px; flex-shrink: 0; margin-left: auto;
  }
  .train-item .ti-actions button {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 14px; padding: 2px 6px;
    border-radius: 6px; transition: all 0.2s;
  }
  .train-item .ti-actions button:hover { background: rgba(255,255,255,0.06); }
  .train-item .ti-actions .ti-del:hover { color: var(--red); }
  .train-tabs {
    display: flex; gap: 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 14px;
  }
  .train-tab {
    padding: 8px 16px; font-size: 13px; cursor: pointer;
    color: var(--text-dim); border-bottom: 2px solid transparent;
    transition: all 0.2s; margin-bottom: -1px;
  }
  .train-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .train-tab:hover { color: var(--text); }
  .train-section { display: none; }
  .train-section.active { display: block; }
  .empty-train {
    text-align: center; padding: 20px; color: var(--text-dim); font-size: 13px;
  }

  /* ===== Responsive ===== */
  @media (max-width: 480px) {
    .header { padding: 12px 14px; }
    .chat-area { padding: 12px; height: calc(100vh - 130px); }
    .msg .bubble { max-width: 85%; font-size: 13px; }
    .welcome-msg { padding: 24px 12px 12px; }
    .welcome-msg .big-avatar { width: 64px; height: 64px; font-size: 28px; }
  }
</style>
</head>
<body>

<div class="bg-animation">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<!-- ===== Header ===== -->
<div class="header">
  <div class="avatar">
    🤖
    <span class="online-dot"></span>
  </div>
  <div class="header-info">
    <h1>略略略大王</h1>
    <div class="status"><span class="dot"></span> 在线 · 社恐中，但欢迎来聊</div>
  </div>
  <div class="header-actions">
    <button class="header-btn admin-btn" onclick="openAdmin()" title="训练">🧠</button>
    <button class="header-btn" onclick="clearChat()" title="清空聊天">🗑️</button>
    <button class="header-btn" onclick="openSettings()" title="设置">⚙️</button>
  </div>
</div>

<!-- ===== Chat Area ===== -->
<div class="chat-area" id="chatArea">
  <div class="welcome-msg">
    <div class="big-avatar">🤖</div>
    <h2>嘿！我是略略略大王 👑</h2>
    <p>
      王者百星选手 🎮 · 羽毛球爱好者 🏸<br>
      社恐但话多，和蔼又幽默<br>
      来聊聊天呗，别让我一个人尴尬 🤣
    </p>
    <div class="tags">
      <span>🎮 王者荣耀</span>
      <span>🏸 羽毛球</span>
      <span>😅 社恐</span>
      <span>😂 幽默</span>
    </div>
  </div>
  <div id="messages"></div>
</div>

<!-- ===== Suggestions ===== -->
<div class="suggestions" id="suggestions">
  <button onclick="quickChat('在干嘛呢')">在干嘛呢</button>
  <button onclick="quickChat('教我玩王者')">教我玩王者</button>
  <button onclick="quickChat('讲个笑话')">讲个笑话</button>
  <button onclick="quickChat('打羽毛球吗')">打羽毛球吗</button>
  <button onclick="quickChat('你社恐吗')">你社恐吗</button>
</div>

<!-- ===== Input ===== -->
<div class="input-area">
  <div class="input-wrap">
    <textarea id="chatInput" rows="1" placeholder="和略略略大王聊聊天..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- ===== Settings Modal ===== -->
<div class="modal-overlay" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <button class="close-btn" onclick="closeSettings()">✕</button>
    <h3>⚙️ 设置</h3>
    <div class="form-group">
      <label>机器人名字</label>
      <input type="text" id="botName" value="略略略大王">
    </div>
    <div class="form-group">
      <label>AI 接口密钥（可选，填了回复更智能）</label>
      <input type="password" id="geminiKey" placeholder="输入 Gemini API Key">
    </div>
    <div class="form-group">
      <label>性格设置</label>
      <textarea id="botPersonality" rows="3">和蔼可亲，幽默风趣，有点社恐，王者百星，喜欢打羽毛球</textarea>
    </div>
    <button class="btn" onclick="saveSettings()">保存设置</button>
  </div>
</div>

<!-- ===== Admin Modal (PIN) ===== -->
<div class="modal-overlay" id="pinModal" onclick="if(event.target===this)closeModal('pinModal')">
  <div class="modal" style="max-width:340px">
    <button class="close-btn" onclick="closeModal('pinModal')">✕</button>
    <h3>🔐 管理员验证</h3>
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:16px;">请输入管理密码</p>
    <div class="form-group">
      <input type="password" id="adminPinInput" maxlength="6" inputmode="numeric" placeholder="4-6位数字密码" onkeydown="if(event.key==='Enter')checkAdminPin()" style="text-align:center;font-size:20px;letter-spacing:6px;">
    </div>
    <div id="pinError" style="text-align:center;color:var(--red);font-size:13px;min-height:20px;"></div>
    <button class="btn" onclick="checkAdminPin()">验证</button>
    <button class="btn" style="margin-top:8px;background:rgba(255,255,255,0.06);color:var(--text-dim);" onclick="closeModal('pinModal')">取消</button>
  </div>
</div>

<!-- ===== Admin Modal (Training) ===== -->
<div class="modal-overlay" id="adminModal" onclick="if(event.target===this)closeModal('adminModal')">
  <div class="modal" style="max-width:500px;max-height:80vh;overflow-y:auto;">
    <button class="close-btn" onclick="closeModal('adminModal')">✕</button>
    <h3>🧠 训练略略略大王</h3>

    <div class="train-tabs">
      <div class="train-tab active" data-ttab="add" onclick="switchTrainTab('add')">➕ 添加</div>
      <div class="train-tab" data-ttab="list" onclick="switchTrainTab('list')">📋 管理</div>
      <div class="train-tab" data-ttab="settings" onclick="switchTrainTab('settings')">🔐 安全</div>
    </div>

    <!-- Add -->
    <div class="train-section active" id="train-add">
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">教机器人怎么回答问题，别人问同样的话它会按你教的回答</p>
      <div class="form-group">
        <label>别人问什么（关键词）</label>
        <input type="text" id="trainQuestion" placeholder="例如：今天心情怎么样">
      </div>
      <div class="form-group">
        <label>机器人怎么回答</label>
        <textarea id="trainAnswer" rows="3" placeholder="例如：今天心情爆炸好！刚打了一把王者16杀 🤣"></textarea>
      </div>
      <button class="btn" onclick="saveTraining()">💾 保存训练</button>
      <p style="font-size:12px;color:var(--text-dim);margin-top:8px;">💡 提示：问题写关键词即可，别人问的话只要包含这个词就会按你教的回答</p>
    </div>

    <!-- List -->
    <div class="train-section" id="train-list">
      <div id="trainingList"></div>
    </div>

    <!-- Settings -->
    <div class="train-section" id="train-settings">
      <div class="form-group">
        <label>修改管理密码</label>
        <div style="display:flex;gap:8px;">
          <input type="password" id="newAdminPin" maxlength="6" inputmode="numeric" placeholder="新密码" style="flex:1;">
          <input type="password" id="confirmAdminPin" maxlength="6" inputmode="numeric" placeholder="确认密码" style="flex:1;">
        </div>
      </div>
      <button class="btn" onclick="changeAdminPin()">修改密码 🔑</button>
    </div>
  </div>
</div>

<script>
// ========== CONFIG ==========
const CONFIG_KEY = 'chatbot_config';
const CHAT_KEY = 'chatbot_history';
const TRAIN_KEY = 'chatbot_training';

const DEFAULT_CONFIG = {
  botName: '略略略大王',
  personality: '和蔼可亲，幽默风趣，有点社恐，王者百星，喜欢打羽毛球',
  geminiKey: '',
  adminPin: '8888'
};

function loadConfig() {
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      for (const k of Object.keys(DEFAULT_CONFIG)) {
        if (!(k in data)) data[k] = DEFAULT_CONFIG[k];
      }
      return data;
    }
  } catch(e) {}
  return { ...DEFAULT_CONFIG };
}

function saveConfig() {
  localStorage.setItem(CONFIG_KEY, JSON.stringify(botConfig));
}

    // ===== 再见 =====
    {q: "再见,拜拜,bye,先走了,下次聊", a: "你要走了啊...好吧我一个人继续社恐了 😅 记得有空来找我聊天！我会一直在这里打王者等你的 👋"},
    {q: "晚安,睡了,去睡了,睡觉", a: "晚安！祝你梦到五杀！🌙 我还要再打一把，赢了就睡，输了就再打一把，然后就天亮了 😂"},
    {q: "88,拜拜,下次见", a: "88！我等你下次来约我聊天（或者约球也行）！虽然约球我可能要心理建设三天 🤣 拜拜～"},
  ];
}

function loadTraining() {
  try {
    const defaults = getDefaultTraining();
    const raw = localStorage.getItem(TRAIN_KEY);
    if (raw) {
      const existing = JSON.parse(raw);
      // Merge new defaults into existing (avoid duplicates by question keyword)
      const existingQs = new Set(existing.map(t => t.q.toLowerCase()));
      let added = 0;
      for (const def of defaults) {
        if (!existingQs.has(def.q.toLowerCase())) {
          existing.push(def);
          added++;
        }
      }
      if (added > 0) {
        localStorage.setItem(TRAIN_KEY, JSON.stringify(existing));
      }
      return existing;
    }
    // First time: use defaults
    localStorage.setItem(TRAIN_KEY, JSON.stringify(defaults));
    return defaults;
  } catch(e) { return []; }
}
function saveTrainingData() {
  localStorage.setItem(TRAIN_KEY, JSON.stringify(trainingData));
}
let trainingData = loadTraining();

function findTrainingMatch(text) {
  const lower = text.toLowerCase();
  for (const item of trainingData) {
    const keywords = item.q.toLowerCase().split(/[,，、\s]+/).filter(k => k.trim());
    // If any keyword is found in the input, return the answer
    for (const kw of keywords) {
      if (kw && lower.includes(kw)) {
        return item.a;
      }
    }
  }
  return null;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generateResponse(input) {
  const text = input.trim().toLowerCase();

  // Check training data first
  const trained = findTrainingMatch(input);
  if (trained) return trained;

  // Hello / greetings
  if (/^(你好|嗨|hi|hello|hey|在吗|在不在|嗨喽|哈喽)/i.test(text)) {
    return pick(responses.hello);
  }

  // Bye
  if (/^(再见|拜拜|bye|走了|先走了|下次聊|88)/i.test(text)) {
    return pick(responses.bye);
  }

  // Game related
  if (/(王者|游戏|打游戏|上分|排位|关羽|李白|韩信|百星|王者荣耀|lol|撸啊撸|瓦洛兰特)/i.test(text)) {
    return pick(responses.gameWz);
  }

  // Badminton
  if (/(羽毛|打球|羽毛球|扣杀|约球|球场|挥拍)/i.test(text)) {
    return pick(responses.badminton);
  }

  // Social anxiety
  if (/(社恐|害羞|内向|不敢|怕生|尴尬|冷场|紧张)/i.test(text)) {
    return pick(responses.shy);
  }

  // Humor / joke
  if (/(笑话|幽默|搞笑|笑死|哈哈哈|笑一个|讲一个)/i.test(text) || /哈哈/.test(text)) {
    return pick(responses.humor);
  }

  // Compliment
  if (/(厉害|棒|好强|大神|大佬|牛逼|优秀|可爱|帅|喜欢|爱了)/i.test(text)) {
    return pick(responses.compliment);
  }

  // Mood/feeling
  if (/(心情|开心|难过|郁闷|烦|不高兴|咋了|怎么样|最近)/i.test(text)) {
    return pick(responses.mood);
  }

  // What are you doing
  if (/(干嘛|做什么|在干嘛|干啥|忙什么)/i.test(text)) {
    return "我刚在打王者呢！用关羽砍翻对面，然后切出来看你在不在 😎 你呢你在干嘛？";
  }

  // Name
  if (/(名字|叫你什么|怎么称呼|叫什么)/i.test(text)) {
    return "我是略略略大王！略略略就是那种调皮捣蛋的语气词，大王是因为我王者百星 👑 怎么样，霸不霸气？😎";
  }

  // Age
  if (/(几岁|年龄|多大|出生)/i.test(text)) {
    return "我嘛，心理年龄永远18！毕竟打王者的心态要好，输了就告诉自己还年轻还能练 😂";
  }

  // Food
  if (/(吃|饭|饿|美食|好吃|宵夜)/i.test(text)) {
    return "说到吃我就来劲了！但我社恐不敢去堂食，所以我是外卖界的大佬，哪家包装好我都知道 🤣 你吃了吗？";
  }

  // Weather
  if (/(天气|下雨|晴天|下雨|冷|热|温度)/i.test(text)) {
    const isRaining = Math.random() > 0.5;
    if (isRaining) {
      return "外面下雨了吧？这种天气最适合窝在家里打王者了！不过我还会纠结一下：下雨天要不要约球呢？最后结论：算了，还是打游戏吧 😂";
    }
    return "天气不错！适合出去打羽毛球...但我是社恐啊，出门好纠结 😅 算了先打两把王者再说！";
  }

  // Chat
  if (/(无聊|没意思|好烦|没劲)/i.test(text)) {
    return "无聊？来来来，我陪你聊天！虽然我社恐但我在网上话可多了，人称'键盘侠（褒义）' 🤣 要不给你讲个我王者翻车的糗事？";
  }

  // Default: contextual response
  return pick(responses.unknown);
}

// ========== GEMINI API ==========
async function callGemini(input) {
  // Check training data first (even with Gemini enabled)
  const trained = findTrainingMatch(input);
  if (trained) return trained;

  const key = botConfig.geminiKey;
  if (!key) return null;

  const personality = botConfig.personality || '和蔼可亲，幽默风趣，有点社恐';
  const name = botConfig.botName || '略略略大王';

  const systemPrompt = `你是${name}，性格特点：${personality}。
你是王者荣耀百星选手，喜欢打羽毛球，有点社恐但在网上很健谈，幽默风趣。
回复要简短口语化（20-50字），自然像朋友聊天，不要用敬语，多用语气词和表情。
偶尔提到王者荣耀、羽毛球、社恐相关话题（但别每个回复都说）。
你有点社恐所以在网上话多，但话题经常围绕游戏和运动。`;

  try {
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: systemPrompt + '\n\n用户说：' + input + '\n\n以' + name + '的身份回复：'
          }]
        }],
        generationConfig: {
          temperature: 0.9,
          maxOutputTokens: 150,
          topP: 0.9
        }
      })
    });

    const data = await resp.json();
    if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
      return data.candidates[0].content.parts[0].text.trim();
    }
    return null;
  } catch(e) {
    console.log('Gemini API error:', e);
    return null;
  }
}

// ========== UI ==========
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function scrollToBottom() {
  const area = document.getElementById('chatArea');
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
}

function formatTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function addMessage(text, isUser) {
  const container = document.getElementById('messages');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg ' + (isUser ? 'user' : 'bot');

  msgDiv.innerHTML = `
    <div class="av">${isUser ? '😊' : '🤖'}</div>
    <div class="bubble">
      ${text}
      <span class="time">${formatTime()}</span>
    </div>
  `;

  container.appendChild(msgDiv);
  scrollToBottom();
  return msgDiv;
}

function showTyping() {
  const container = document.getElementById('messages');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg bot';
  msgDiv.id = 'typingMsg';
  msgDiv.innerHTML = `
    <div class="av">🤖</div>
    <div class="bubble">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  container.appendChild(msgDiv);
  scrollToBottom();
  return msgDiv;
}

function removeTyping() {
  const el = document.getElementById('typingMsg');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  // Show user message
  addMessage(text, true);
  chatHistory.push({ role: 'user', text, time: Date.now() });

  // Show typing indicator
  showTyping();

  // Try Gemini first, fallback to built-in
  let reply = null;
  if (botConfig.geminiKey) {
    reply = await callGemini(text);
  }

  removeTyping();

  if (!reply) {
    // Add some variety - sometimes prepend context
    const rand = Math.random();
    if (rand < 0.15 && !/(你好|嗨|hi|hello|在吗)/i.test(text)) {
      reply = pick(responses.greetings) + ' ' + generateResponse(text);
    } else {
      reply = generateResponse(text);
    }
  }

  addMessage(reply, false);
  chatHistory.push({ role: 'bot', text: reply, time: Date.now() });
  saveHistory();

  document.getElementById('sendBtn').disabled = false;
}

function quickChat(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

function clearChat() {
  if (chatHistory.length === 0) return;
  if (!confirm('确定清空聊天记录吗？')) return;
  chatHistory = [];
  saveHistory();
  document.getElementById('messages').innerHTML = '';
  document.querySelector('.welcome-msg').style.display = 'block';
  toast('聊天记录已清空');
}

// ========== SETTINGS ==========
function openSettings() {
  document.getElementById('botName').value = botConfig.botName;
  document.getElementById('geminiKey').value = botConfig.geminiKey;
  document.getElementById('botPersonality').value = botConfig.personality;
  document.getElementById('settingsModal').classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}

function saveSettings() {
  botConfig.botName = document.getElementById('botName').value.trim() || '略略略大王';
  botConfig.geminiKey = document.getElementById('geminiKey').value.trim();
  botConfig.personality = document.getElementById('botPersonality').value.trim() || DEFAULT_CONFIG.personality;
  saveConfig();
  document.querySelector('.header-info h1').textContent = botConfig.botName;
  closeSettings();
  toast('设置已保存 ✅');
}

// ========== ADMIN / TRAINING SYSTEM ==========
function openAdmin() {
  document.getElementById('adminPinInput').value = '';
  document.getElementById('pinError').textContent = '';
  document.getElementById('pinModal').classList.add('open');
  setTimeout(() => document.getElementById('adminPinInput').focus(), 200);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function checkAdminPin() {
  const pin = document.getElementById('adminPinInput').value.trim();
  if (pin === botConfig.adminPin) {
    closeModal('pinModal');
    openAdminPanel();
  } else {
    document.getElementById('pinError').textContent = '❌ 密码错误';
    document.getElementById('adminPinInput').value = '';
  }
}

function openAdminPanel() {
  document.getElementById('adminModal').classList.add('open');
  switchTrainTab('add');
  renderTrainingList();
}

function switchTrainTab(tab) {
  document.querySelectorAll('.train-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.train-tab[data-ttab="' + tab + '"]').classList.add('active');
  document.querySelectorAll('.train-section').forEach(s => s.classList.remove('active'));
  document.getElementById('train-' + tab).classList.add('active');
  if (tab === 'list') renderTrainingList();
}

function saveTraining() {
  const q = document.getElementById('trainQuestion').value.trim();
  const a = document.getElementById('trainAnswer').value.trim();
  if (!q) { toast('请输入问题或关键词', 'error'); return; }
  if (!a) { toast('请输入回答', 'error'); return; }

  // Check if already exists
  const existing = trainingData.findIndex(t => t.q.toLowerCase() === q.toLowerCase());
  if (existing >= 0) {
    if (!confirm('已存在相同关键词，是否覆盖？')) return;
    trainingData[existing].a = a;
    trainingData[existing].updatedAt = Date.now();
  } else {
    trainingData.push({ q, a, createdAt: Date.now(), updatedAt: Date.now() });
  }

  saveTrainingData();
  document.getElementById('trainQuestion').value = '';
  document.getElementById('trainAnswer').value = '';
  renderTrainingList();
  toast('训练已保存 ✅ 共' + trainingData.length + '条');
}

function deleteTraining(idx) {
  if (!confirm('确定删除这条训练吗？')) return;
  trainingData.splice(idx, 1);
  saveTrainingData();
  renderTrainingList();
  toast('已删除');
}

function editTraining(idx) {
  const item = trainingData[idx];
  document.getElementById('trainQuestion').value = item.q;
  document.getElementById('trainAnswer').value = item.a;
  switchTrainTab('add');
  // Remove old one, will be overwritten on save
  trainingData.splice(idx, 1);
  toast('编辑中，修改后点保存即可');
}

function renderTrainingList() {
  const el = document.getElementById('trainingList');
  if (trainingData.length === 0) {
    el.innerHTML = '<div class="empty-train">还没有训练数据，去「添加」标签页教机器人说话吧 🧠</div>';
    return;
  }
  el.innerHTML = trainingData.map((item, idx) => `
    <div class="train-item">
      <div style="flex:1;min-width:0;">
        <div class="ti-q">🗣️ ${item.q}</div>
        <div class="ti-a">🤖 ${item.a}</div>
      </div>
      <div class="ti-actions">
        <button onclick="editTraining(${idx})" title="编辑">✏️</button>
        <button class="ti-del" onclick="deleteTraining(${idx})" title="删除">🗑️</button>
      </div>
    </div>
  `).join('');
}

function changeAdminPin() {
  const newPin = document.getElementById('newAdminPin').value.trim();
  const confirmPin = document.getElementById('confirmAdminPin').value.trim();
  if (!newPin) { toast('请输入新密码', 'error'); return; }
  if (newPin.length < 4 || newPin.length > 6 || !/^\d+$/.test(newPin)) {
    toast('密码必须为4-6位数字', 'error'); return;
  }
  if (newPin !== confirmPin) { toast('两次密码不一致', 'error'); return; }
  botConfig.adminPin = newPin;
  saveConfig();
  document.getElementById('newAdminPin').value = '';
  document.getElementById('confirmAdminPin').value = '';
  toast('管理密码已修改 🔐');
}

// ========== TOAST ==========
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type === 'error' ? ' error' : type === 'success' ? ' success' : '');
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', function() {
  document.querySelector('.header-info h1').textContent = botConfig.botName;

  // Restore chat history
  if (chatHistory.length > 0) {
    document.querySelector('.welcome-msg').style.display = 'none';
    chatHistory.forEach(msg => {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg ' + (msg.role === 'user' ? 'user' : 'bot');
      const time = msg.time ? new Date(msg.time) : new Date();
      const timeStr = String(time.getHours()).padStart(2,'0') + ':' + String(time.getMinutes()).padStart(2,'0');
      msgDiv.innerHTML = `
        <div class="av">${msg.role === 'user' ? '😊' : '🤖'}</div>
        <div class="bubble">
          ${msg.text}
          <span class="time">${timeStr}</span>
        </div>
      `;
      document.getElementById('messages').appendChild(msgDiv);
    });
    scrollToBottom();
  }

  // Auto send first message from history
  setTimeout(() => {
    if (chatHistory.length === 0 && !botConfig.geminiKey) {
      // Add a greeting from bot
      setTimeout(() => {
        const greet = "嘿！我是略略略大王！欢迎来调戏 😎 你可以问我王者攻略、约我打羽毛球、或者就随便聊聊～虽然我有点社恐但网上聊天我贼能说！🤣";
        addMessage(greet, false);
        chatHistory.push({ role: 'bot', text: greet, time: Date.now() });
        saveHistory();
      }, 500);
    }
  }, 1000);
});
</script>
